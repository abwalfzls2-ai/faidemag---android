
name: Build Faidemag APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'faidemag_android_project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Extract project
        run: unzip -q faidemag_android_project.zip

      - name: Build APK
        run: |
          cd faidemag_android_project
          ../gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: faidemag-apk
          path: faidemag_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
